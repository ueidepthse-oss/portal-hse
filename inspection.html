<style>
:root{--g1:#0b8a42;--g2:#08672f;--g3:#24a65a;--gbg:#e8f5ec;--bg:#eaf4ed;--tx:#0d3b22;--mut:#5d7a6a;--line:#cfe3d6;--red:#d32f2f;--blue:#0e7fa8;--yellow:#f5c400;--bounce:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column;position:relative;overflow-x:hidden}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg svg{position:absolute}.bg .hex{inset:0;width:100%;height:100%}
.bg .shield{right:-70px;bottom:20px;width:440px;height:440px;opacity:.10;fill:none;stroke:var(--g1);stroke-width:.6;stroke-linecap:round;stroke-linejoin:round}
header,.stripe,main,footer{position:relative;z-index:1}header{z-index:5}
header{background:linear-gradient(90deg,var(--g2),var(--g1));color:#fff;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 20px;height:56px;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.brand img{height:36px;width:auto}.brand .sep{width:1px;height:26px;background:rgba(255,255,255,.55)}
nav{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
nav>a,.dd>a{color:#fff;text-decoration:none;font-size:13px;font-weight:600;letter-spacing:.4px;padding:8px 12px;border-radius:6px;text-transform:uppercase;display:block;transition:background .2s}
nav>a:hover,.dd>a:hover{background:rgba(255,255,255,.18);animation:hop .55s ease}
nav .active{background:var(--g2);box-shadow:inset 0 -3px 0 var(--yellow)}
.dd{position:relative}.dd>a::after{content:" ▾";font-size:10px}
.menu{display:none;position:absolute;top:100%;right:0;min-width:210px;padding-top:6px}
.menu .box{background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 10px 24px rgba(13,59,34,.28);border-top:4px solid var(--yellow);animation:popIn .45s var(--bounce)}
.dd:hover .menu,.dd:focus-within .menu{display:block}
.menu a{display:flex;align-items:center;gap:10px;padding:10px 14px;color:var(--g2);text-decoration:none;font-size:13px;font-weight:700;border-bottom:1px solid var(--line);transition:padding .2s var(--bounce),background .2s}
.menu a:last-child{border-bottom:0}.menu a:hover{background:var(--gbg);padding-left:20px}.menu .ic{font-size:17px;color:var(--g1)}
.stripe{height:6px;flex:none;background:repeating-linear-gradient(-45deg,var(--yellow) 0 10px,#1c1c1c 10px 20px)}

@keyframes popIn{0%{opacity:0;transform:translateY(26px) scale(.88)}55%{opacity:1;transform:translateY(-7px) scale(1.03)}78%{transform:translateY(3px) scale(.99)}100%{opacity:1;transform:none}}
@keyframes hop{0%,100%{transform:translateY(0)}28%{transform:translateY(-9px)}50%{transform:translateY(0)}66%{transform:translateY(-4px)}82%{transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.pop{opacity:0;animation:popIn .8s var(--bounce) forwards;animation-delay:calc(var(--i,0) * 90ms)}

main{flex:1;padding:16px 20px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;align-items:start}
.crumb{grid-column:1/3;font-size:12px;color:var(--mut)}.crumb a{color:var(--g1);text-decoration:none;font-weight:700}
.side{background:#fff;border-radius:10px;border-top:6px solid var(--blue);box-shadow:0 4px 14px rgba(13,59,34,.14);padding:12px;position:sticky;top:10px}
.side h2{font-size:13px;color:var(--g2);text-transform:uppercase;letter-spacing:.5px;margin:2px 4px 8px}
.side button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font:inherit;font-size:13px;font-weight:700;color:var(--g2);background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:6px;cursor:pointer;transition:.2s var(--bounce)}
.side button small{margin-left:auto;font-weight:600;color:var(--mut);font-size:10.5px}
.side button:hover{transform:translateX(5px);border-color:var(--g1)}
.side button.on{background:var(--g1);border-color:var(--g1);color:#fff}.side button.on small{color:#dff5e7}
.panel{background:#fff;border-radius:10px;border-top:6px solid var(--blue);box-shadow:0 4px 14px rgba(13,59,34,.14);padding:18px 22px 22px;min-width:0}
.ptitle{display:flex;align-items:center;gap:12px}
.ptitle .ico{width:46px;height:46px;border-radius:50%;background:#dff1fa;color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:24px;animation:hop 2.8s infinite}
.ptitle h1{font-size:19px;color:var(--g2)}.ptitle small{display:block;font-size:12px;color:var(--mut);font-weight:400}
.sec{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--g2);margin:16px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--gbg)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 16px}.full{grid-column:1/3}
label{display:block;font-size:12.5px;font-weight:700;margin-bottom:4px}label i{color:var(--red);font-style:normal}
input,select,textarea{width:100%;font:inherit;font-size:13.5px;padding:9px 11px;border:1.5px solid var(--line);border-radius:7px;background:#fff;color:var(--tx);transition:border .2s,box-shadow .2s}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--g1);box-shadow:0 0 0 3px rgba(11,138,66,.18)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.ck{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
.ck th{background:var(--gbg);color:var(--g2);font-size:11px;text-transform:uppercase;padding:8px;text-align:center}
.ck td{border-top:1px solid var(--line);padding:6px 8px;text-align:center}.ck td.t{text-align:left}
.ck tr:hover td{background:#f3faf5}
.ck input[type=radio]{width:18px;height:18px;accent-color:var(--g1);cursor:pointer}
.ck input.bad{accent-color:var(--red)}.ck td input[type=text]{padding:5px 7px;font-size:12.5px}
.sum{margin-top:8px;font-size:12.5px;font-weight:700;color:var(--g2)}
.ha{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ha label{margin:0;cursor:pointer}.ha input{display:none}
.ha span{display:block;text-align:center;padding:10px 6px;border:2px solid var(--c);border-radius:7px;color:var(--c);font-weight:700;font-size:13px;transition:.2s var(--bounce)}
.ha span:hover{transform:translateY(-3px)}.ha input:checked+span{background:var(--c);color:#fff;transform:scale(1.05)}
.actions{display:flex;gap:12px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.btn{font:inherit;font-weight:800;letter-spacing:.4px;padding:11px 24px;border-radius:8px;border:0;cursor:pointer;transition:.2s var(--bounce)}
.btn:hover{transform:translateY(-3px) scale(1.04)}
.btn.main{background:linear-gradient(90deg,var(--g2),var(--g1));color:#fff;box-shadow:0 4px 10px rgba(11,138,66,.35)}
.btn.sec2{background:#fff;color:var(--g2);border:2px solid var(--g1)}.btn:disabled{opacity:.6;cursor:wait;transform:none}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}
.msg{display:none;margin-top:14px;padding:10px 14px;border-radius:7px;font-size:13px;font-weight:600;background:#fde4e4;color:#b71c1c}
.modal{position:fixed;inset:0;z-index:50;background:rgba(8,40,22,.55);display:none;align-items:center;justify-content:center;padding:20px}.modal.on{display:flex}
.mbox{background:#fff;border-radius:14px;padding:28px 30px;text-align:center;max-width:440px;border-top:6px solid var(--g1);animation:popIn .6s var(--bounce)}
.mbox.warn{border-top-color:var(--yellow)}
.mbox .ok{width:64px;height:64px;margin:0 auto 10px;border-radius:50%;background:var(--gbg);color:var(--g1);display:flex;align-items:center;justify-content:center;font-size:36px;animation:hop 1.4s infinite}
.mbox h2{color:var(--g2);margin-bottom:6px}.mbox p{font-size:13.5px;color:var(--mut)}
.mbox b{display:inline-block;margin:8px 0 10px;font-size:22px;color:var(--g2);background:var(--gbg);padding:4px 16px;border-radius:8px}
.mbox .drv{display:block;margin:0 0 12px;font-size:13px;font-weight:700;color:var(--g1)}
.mbox .btn{margin:4px}
footer{background:linear-gradient(90deg,var(--g2),var(--g1));color:#fff;flex:none;height:46px;margin:0 20px 12px;border-radius:8px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:13px}
footer .brand{font-size:13px}footer .brand img{height:26px}

/* ===== LEMBAR A4 (dipakai untuk cetak dan untuk PDF) ===== */
#sheet{display:none}
.sh{font-family:Arial,sans-serif;color:#000;font-size:9pt;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pdfbox{width:184.6mm;min-height:268mm;display:flex;flex-direction:column}
/* header (tetap seperti awal) */
.sh .ph{display:flex;justify-content:flex-end;align-items:flex-end;gap:8px;border-bottom:2px solid #0F9ED5;padding-bottom:2px}
.sh .ph img{height:9mm;width:auto}
.sh .ph .id{border-left:2px solid #0F9ED5;margin-left:6px;padding-left:5px;font:bold 7.5pt 'Times New Roman',serif}
.sh .ph .id div{display:flex;gap:4px;border-bottom:1px dashed #000;padding:0 2px;line-height:1.35}
.sh .ph .id div:last-child{border:0}.sh .ph .id span:first-child{width:23mm}.sh .ph .id span:nth-child(2){width:2mm}.sh .ph .id span:last-child{width:34mm}
/* isi (mengikuti contoh) */
.sh .ttl{background:#00673a;color:#fff;font-weight:bold;font-size:11pt;text-align:center;padding:5px;margin:8px 0 6px;letter-spacing:.4px}
.sh table{width:100%;border-collapse:collapse}
.sh .inf th{background:#e4f3ea;text-align:left;font-size:8.5pt;padding:3px 6px;border:1px solid #9fd4b5;width:30mm}
.sh .inf td{border:1px solid #9fd4b5;padding:3px 6px;font-size:8.5pt}
.sh .cl{margin-top:7px}
.sh .cl th{background:#00994d;color:#fff;padding:4px;border:1px solid #9fd4b5;font-size:8.5pt}
.sh .cl td{border:1px solid #9fd4b5;padding:2.5px 5px;font-size:8.5pt}
.sh .cl tbody tr:nth-child(even) td{background:#f3faf5}
.sh .cl td.c{text-align:center;width:12mm;color:#0a7a3d;font-weight:bold}.sh .cl td.n{text-align:center;width:9mm}
.sh .cl td.c.x{color:#c62828}
.sh .rk{text-align:right;font-size:8.5pt;margin:4px 0 6px}
.sh .bx2{display:flex;gap:8px}.sh .bx2>div{flex:1;border:1px solid #9fd4b5}
.sh .bx2 h5{background:#e4f3ea;font-size:8.5pt;padding:3px 6px}
.sh .bx2 p{min-height:15mm;padding:3px 6px;font-size:8.5pt;white-space:pre-wrap}
.sh .hk{border:1px solid #9fd4b5;padding:5px 8px;margin-top:8px;font-size:9pt;display:flex;gap:16px;align-items:center}
.sh .hk .on{font-weight:bold;color:#0a6b35}
.sh .bt{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px}
.sh .pr{font-size:7.5pt;color:#555}
.sh .sgs{display:flex;gap:8px}.sh .sgs>div{width:42mm;border:1px solid #00994d;text-align:center}
.sh .sgs h5{background:#00994d;color:#fff;font-size:8.5pt;padding:3px}
.sh .sgs i{display:block;height:22mm}
.sh .sgs u{display:block;border-top:1px solid #00994d;text-decoration:none;font-size:8.5pt;padding:2px;min-height:5.5mm}
/* footer biru (tetap) */
.sh .ft{background:#00B0F0;color:#fff;font:bold 8pt Arial,sans-serif;padding:3px 6px;margin-top:auto}
@media print{
  @page{size:A4 portrait;margin:12.7mm}
  body{background:#fff;display:block;min-height:0}
  body>*:not(#sheet){display:none!important}
  #sheet{display:block}
  #sheet .ft{position:fixed;left:0;right:0;bottom:0;margin:0}
}
@media (max-width:900px){
  header{height:auto;flex-direction:column;align-items:flex-start;padding:10px 14px}nav{justify-content:flex-start}.menu{right:auto;left:0}
  main{grid-template-columns:1fr;padding:12px 14px}.crumb{grid-column:1}.side{position:static}
  .grid{grid-template-columns:1fr}.full{grid-column:1}.panel{padding:14px}.ha{grid-template-columns:1fr}
  footer{margin:0 14px 12px;height:auto;padding:12px;flex-direction:column;gap:6px;text-align:center}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.pop{opacity:1}}
</style>

 {k:"jigsaw",n:"Jig Saw",no:"012",it:[BODY,

 {k:"circular",n:"Circular Saw",no:"013",it:[BODY,

  "Mur / baut pengunci mata gergaji kencang","Riving knife / splitter terpasang","Pengatur kedalaman dan sudut potong terkunci kuat",
  "Fence / guide potong berfungsi dan tidak longgar","Handle utama dan handle bantu terpasang kuat"].concat(KABEL,TAG)},
 {k:"heatgun",n:"Heat Gun",no:"014",it:[BODY,

  "Lubang udara masuk tidak tersumbat","Kabel power tahan panas dan tidak meleleh","Stand / penyangga alat tersedia dan stabil",
  "Tidak ada asap atau bau terbakar saat dicoba"].concat(KABEL.slice(1,3),TAG)},
 {k:"cutting",n:"Cutting Wheel",no:"015",it:[BODY,
  "Cakram potong tidak retak, gompal, atau aus dan belum kedaluwarsa","Ukuran cakram sesuai spesifikasi mesin","Pelindung (guard) cakram terpasang lengkap",
  "Flens dan mur pengunci cakram kencang","Penjepit benda kerja (vise) kuat dan berfungsi","Pegas pengembali lengan mesin berfungsi",
  "Arah putaran sesuai tanda panah pada guard"].concat(KABEL,TAG)},
 {k:"bor-magnet",n:"Bor Magnet",no:"016",it:[BODY,
  "Daya magnet menempel kuat dan indikator magnet berfungsi","Dasar (base) magnet bersih, rata, dan tidak berkarat","Tali / rantai pengaman terpasang kuat",
  "Annular cutter tajam, tidak retak, dan tidak ompong","Arbor / chuck terpasang kencang","Sistem pendingin / pelumas berfungsi tanpa kebocoran",
  "Handle (lever) feed dan pelindung (guard) berfungsi","Kolom / slide bergerak halus tanpa goyang"].concat(KABEL,TAG)}
];

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso = () => { const n = new Date(); return new Date(n.getTime() - n.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const tglIndo = v => { const d = new Date(v); return isNaN(d) ? "" : d.toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"}); };
const judul = t => "FORM INSPEKSI " + t.n.toUpperCase();
let cur = T[0], lastPdf = null, hasilManual = false;

function renderList(){
  $("list").innerHTML = T.map(t => `<button type="button" data-k="${t.k}" class="${t.k === cur.k ? "on" : ""}">${esc(t.n)}<small>FRM-${t.no}</small></button>`).join("");
}
$("list").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  cur = T.find(t => t.k === b.dataset.k); renderList(); renderForm();
  $("frm").scrollIntoView({behavior:"smooth", block:"start"});
});

function renderForm(){
  const t = cur; hasilManual = false;
  $("frm").innerHTML = `
    <div class="ptitle"><div class="ico"><svg class="ic"><use href="#i-inspect"/></svg></div>
      <h1>${esc(judul(t))}<small>UEI/HSE/FRM/${t.no} · Berlaku ${TGL_BERLAKU} · Rev ${REVISI}</small></h1></div>

    <div class="sec">Data Inspeksi</div>
    <div class="grid">
      <div><label>Tanggal Inspeksi <i>*</i></label><input type="date" id="f-tanggal" value="${iso()}"></div>
      <div><label>Lokasi / Area <i>*</i></label><input id="f-lokasi"></div>
      <div><label>Nama Inspektur <i>*</i></label><input id="f-inspektur"></div>
      <div><label>${t.apar ? "No. ID / Kode APAR" : "No. ID / Kode Alat"} <i>*</i></label><input id="f-kode" placeholder="${t.apar ? "Contoh: APAR-001" : "Contoh: BOR-003"}"></div>
      <div><label>Merk / Tipe</label><input id="f-merk" placeholder="Contoh: KRISBOW / 18W"></div>
      ${t.apar ? `<div><label>Jenis Media / Kapasitas <i>*</i></label><select id="f-kap">${t.kap.length > 1 ? '<option value="">- pilih kapasitas -</option>' : ""}${t.kap.map(x => `<option>${x}</option>`).join("")}</select></div>
      <div><label>Tanggal Kedaluwarsa <i>*</i></label><input type="date" id="f-exp"></div>` : ""}
    </div>

    <div class="sec">Poin Pemeriksaan</div>
    <div class="tw"><table class="ck"><thead><tr><th>No</th><th style="text-align:left">Poin Pemeriksaan</th><th>OK</th><th>Tidak OK</th><th>N/A</th><th>Keterangan</th></tr></thead><tbody>
      ${t.it.map((x,i) => `<tr><td>${i+1}</td><td class="t">${esc(x)}</td>
        <td><input type="radio" name="c${i}" value="OK"></td>
        <td><input type="radio" class="bad" name="c${i}" value="Tidak OK"></td>
        <td><input type="radio" name="c${i}" value="N/A"></td>
        <td><input type="text" id="k${i}"></td></tr>`).join("")}
    </tbody></table></div>
    <div class="sum" id="sum"></div>

    <div class="sec">Temuan &amp; Tindak Lanjut</div>
    <div class="grid">
      <div><label>Temuan / Catatan</label><textarea id="f-temuan"></textarea></div>
      <div><label>Tindak Lanjut / Perbaikan</label><textarea id="f-tindak"></textarea></div>
    </div>

    <div class="sec">Hasil Akhir <i style="color:var(--red);font-style:normal">*</i></div>
    <div class="ha">${HASIL.map(h => `<label style="--c:${HCOL[h]}"><input type="radio" name="ha" value="${h}"><span>${h}</span></label>`).join("")}</div>

    <div class="sec">Pengesahan</div>
    <div class="grid">
      <div class="full"><label>Diketahui oleh (Nama Supervisor / HSE)</label><input id="f-mengetahui"></div>
    </div>

    <div class="msg" id="msg"></div>
    <div class="actions">
      <button type="button" class="btn sec2" id="bReset">Reset</button>
      <button type="button" class="btn sec2" id="bPrint">🖨 Cetak</button>
      <button type="submit" class="btn main" id="bSend">Simpan &amp; Kirim</button>
    </div>`;
  $("bReset").onclick = renderForm;
  $("bPrint").onclick = () => { buildSheet(); window.print(); };
  $("frm").querySelectorAll(".ck input[type=radio]").forEach(r => r.addEventListener("change", () => { summary(); autoHasil(); }));
  $("frm").querySelectorAll('input[name="ha"]').forEach(r => r.addEventListener("change", () => { hasilManual = true; }));
  summary();
}

function state(){
  const t = cur;
  const rows = t.it.map((x,i) => { const r = document.querySelector(`input[name="c${i}"]:checked`); return {x, v: r ? r.value : "", k: $("k"+i).value.trim()}; });
  const h = document.querySelector('input[name="ha"]:checked');
  return {
    tanggal: $("f-tanggal").value, kode: $("f-kode").value.trim(), lokasi: $("f-lokasi").value.trim(),
    inspektur: $("f-inspektur").value.trim(), merk: $("f-merk").value.trim(),
    kapasitas: t.apar ? $("f-kap").value : "", expired: t.apar ? $("f-exp").value : "",
    temuan: $("f-temuan").value.trim(), tindak: $("f-tindak").value.trim(), mengetahui: $("f-mengetahui").value.trim(),
    hasil: h ? h.value : "", rows,
    baik: rows.filter(r => r.v === "OK").length, buruk: rows.filter(r => r.v === "Tidak OK").length,
    na: rows.filter(r => r.v === "N/A").length, kosong: rows.filter(r => !r.v).length
  };
}
function summary(){
  const s = state();
  $("sum").textContent = `Ringkasan: OK ${s.baik} | Tidak OK ${s.buruk} | N/A ${s.na}` + (s.kosong ? ` | ${s.kosong} butir belum diisi` : "");
  $("sum").style.color = s.buruk ? "#b71c1c" : "";
}
/* usulan Hasil Akhir otomatis (masih bisa diubah manual) */
function autoHasil(){
  if(hasilManual) return;
  const s = state(); if(s.kosong) return;
  const v = s.buruk === 0 ? HASIL[0] : HASIL[1];
  const r = document.querySelector(`input[name="ha"][value="${v}"]`); if(r) r.checked = true;
}
function showMsg(t){ const m = $("msg"); m.textContent = t; m.style.display = t ? "block" : "none"; }

/* ===== lembar A4 (HTML) ===== */
function sheetHtml(){
  const t = cur, s = state(), now = new Date();
  const mark = (r, v) => r.v === v ? "✓" : "";
  const cetak = now.toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"}) + " pukul " +
    String(now.getHours()).padStart(2,"0") + "." + String(now.getMinutes()).padStart(2,"0");
  return `
  <div class="ph"><img src="assets/gambar/logo-ikon.png" alt=""><img src="assets/gambar/logo-uei.png" alt="">
    <div class="id">
      <div><span>No. Dokumen</span><span>:</span><span>UEI/HSE/FRM/${t.no}</span></div>
      <div><span>Tanggal Berlaku</span><span>:</span><span>${TGL_BERLAKU}</span></div>
      <div><span>No. Revisi</span><span>:</span><span>${REVISI}</span></div>
      <div><span>Halaman</span><span>:</span><span>1 dari 1</span></div>
      <div><span>Departemen</span><span>:</span><span>HSE</span></div>
    </div></div>
  <div class="ttl">${esc(judul(t))}</div>
  <table class="inf">
    <tr><th>Tanggal Inspeksi</th><td>${esc(tglIndo(s.tanggal))}</td><th>Lokasi / Area</th><td>${esc(s.lokasi)}</td></tr>
    <tr><th>Nama Inspektur</th><td>${esc(s.inspektur)}</td><th>No. ID / Kode Alat</th><td>${esc(s.kode)}</td></tr>
    <tr><th>Merk / Tipe</th><td>${esc(s.merk)}</td>${t.apar ? `<th>Jenis / Kapasitas</th><td>${t.apar} / ${esc(s.kapasitas)}</td>` : `<th></th><td></td>`}</tr>
    ${t.apar ? `<tr><th>Tgl Kedaluwarsa</th><td>${esc(tglIndo(s.expired))}</td><th></th><td></td></tr>` : ""}
  </table>
  <table class="cl"><thead><tr><th>No</th><th>Poin Pemeriksaan</th><th>OK</th><th>Tidak OK</th><th>N/A</th><th>Keterangan</th></tr></thead><tbody>
    ${s.rows.map((r,i) => `<tr><td class="n">${i+1}</td><td>${esc(r.x)}</td><td class="c">${mark(r,"OK")}</td><td class="c x">${mark(r,"Tidak OK")}</td><td class="c">${mark(r,"N/A")}</td><td>${esc(r.k)}</td></tr>`).join("")}
  </tbody></table>
  <div class="rk">Ringkasan: <b>OK ${s.baik}</b> &nbsp;|&nbsp; <b>Tidak OK ${s.buruk}</b> &nbsp;|&nbsp; <b>N/A ${s.na}</b></div>
  <div class="bx2"><div><h5>Temuan / Catatan</h5><p>${esc(s.temuan)}</p></div><div><h5>Tindak Lanjut / Perbaikan</h5><p>${esc(s.tindak)}</p></div></div>
  <div class="hk"><b>Hasil Akhir:</b>${HASIL.map(h => `<span class="${h === s.hasil ? "on" : ""}">${h === s.hasil ? "☑" : "☐"} ${h}</span>`).join("")}</div>
  <div class="bt"><div class="pr">Dicetak dari Portal HSE Department pada ${cetak}</div>
    <div class="sgs"><div><h5>Diketahui oleh</h5><i></i><u>${esc(s.mengetahui)}</u></div><div><h5>Diperiksa oleh</h5><i></i><u>${esc(s.inspektur)}</u></div></div></div>
  <div class="ft">DOKUMEN MILIK DEPARTEMEN HSE PT UNGGUL EJAWANTAH INDUSTRI</div>`;
}
function buildSheet(){ $("sheet").innerHTML = sheetHtml(); }

/* ===== buat PDF A4 di browser ===== */
async function makePdf(){
  if(!window.html2pdf) throw new Error("pustaka PDF belum termuat (cek koneksi internet)");
  const holder = document.createElement("div");
  holder.style.cssText = "position:fixed;left:-10000px;top:0;";
  const w = document.createElement("div");
  w.className = "sh pdfbox"; w.innerHTML = sheetHtml();
  holder.appendChild(w); document.body.appendChild(holder);
  try{
    await Promise.all([...w.querySelectorAll("img")].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; })));
    const uri = await html2pdf().set({
      margin: [12.7,12.7,12.7,12.7],
      image: {type:"jpeg", quality:.92},
      html2canvas: {scale:1.6, useCORS:true, scrollX:0, scrollY:0},
      jsPDF: {unit:"mm", format:"a4", orientation:"portrait"}
    }).from(w).outputPdf("datauristring");
    return uri.split(",")[1];
  }finally{ holder.remove(); }
}
function pdfName(t, s){ return [t.no, t.n, s.kode, s.tanggal].join("_").replace(/[^\w\-]+/g,"-"); }
function download(){
  if(!lastPdf) return;
  const a = document.createElement("a");
  a.href = "data:application/pdf;base64," + lastPdf.b64; a.download = lastPdf.name + ".pdf";
  document.body.appendChild(a); a.click(); a.remove();
}

/* ===== simpan: PDF + Google Sheets + Google Drive ===== */
$("frm").addEventListener("submit", async e => {
  e.preventDefault(); showMsg("");
  const t = cur, s = state();
  const k = [];
  if(!s.tanggal) k.push("Tanggal"); if(!s.kode) k.push("Kode"); if(!s.lokasi) k.push("Lokasi"); if(!s.inspektur) k.push("Inspektur");
  if(t.apar){ if(!s.kapasitas) k.push("Kapasitas"); if(!s.expired) k.push("Tanggal Kedaluwarsa"); }
  if(k.length){ showMsg("Lengkapi dulu kolom wajib: " + k.join(", ") + "."); return; }
  if(s.kosong){ showMsg(`Masih ada ${s.kosong} butir pemeriksaan yang belum dipilih.`); return; }
  if(!s.hasil){ showMsg("Pilih Hasil Akhir terlebih dahulu."); return; }

  const data = {
    tanggal: s.tanggal, form: "UEI/HSE/FRM/" + t.no, alat: t.n, kode: s.kode, lokasi: s.lokasi,
    kapasitas: s.kapasitas, expired: s.expired, inspektur: s.inspektur,
    hasil: `${s.baik} OK, ${s.buruk} Tidak OK, ${s.na} N/A`,
    ketidaksesuaian: s.rows.filter(r => r.v === "Tidak OK").map(r => r.x + (r.k ? " (" + r.k + ")" : "")).join("; "),
    detail: s.rows.map((r,i) => `${i+1}. ${r.v}${r.k ? " - " + r.k : ""}`).join(" | "),
    catatan: s.temuan, mengetahui: s.mengetahui,
    merk: s.merk, tindaklanjut: s.tindak, hasilakhir: s.hasil
  };
  const status = (s.hasil === HASIL[0] && s.buruk === 0) ? "Closed" : "Open";
  const btn = $("bSend"); btn.disabled = true;
  let ok = false, pdfB64 = "", resp = null, pdfGagal = "";
  try{
    btn.innerHTML = '<span class="spin"></span>Membuat PDF...';
    try{ pdfB64 = await makePdf(); }catch(err){ pdfGagal = err.message; }
    btn.innerHTML = '<span class="spin"></span>Mengirim...';
    const res = await fetch(URL_SHEETS, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({type:"inspection", status, data, photos: [], pdf: pdfB64, pdfName: pdfName(t, s)})});
    resp = await res.json();
    if(!resp.ok) throw new Error(resp.error || "Gagal menyimpan");
    ok = true;
  }catch(err){
    showMsg("Inspeksi belum terkirim: " + err.message + ". Periksa koneksi lalu coba lagi.");
  }finally{
    btn.disabled = false; btn.textContent = "Simpan & Kirim";
  }
  if(ok){
    buildSheet();
    lastPdf = pdfB64 ? {b64: pdfB64, name: pdfName(t, s)} : null;
    $("newid").textContent = resp.id;
    $("mDown").style.display = lastPdf ? "" : "none";
    const dv = $("mDrive"), warn = !resp.pdf;
    $("mBox").classList.toggle("warn", warn);
    if(resp.pdf){
      dv.href = resp.pdf; dv.style.display = "block";
      $("mTxt").textContent = "Data masuk ke Google Sheet dan PDF tersimpan otomatis di Google Drive (folder Inspection / bulan / jenis inspeksi).";
    }else{
      dv.style.display = "none";
      let m = "Data masuk ke Google Sheet, tetapi PDF belum tersimpan di Google Drive. ";
      if(pdfGagal) m += "PDF gagal dibuat: " + pdfGagal + ".";
      else if(resp.pdfError) m += "Penyebab dari server: " + resp.pdfError;
      else m += "Kemungkinan Code.gs terbaru belum di-deploy sebagai New version.";
      $("mTxt").textContent = m + " Anda masih bisa mencetak form ini.";
    }
    $("modal").classList.add("on");
  }
});
$("mPrint").onclick = () => window.print();
$("mDown").onclick = download;
$("mClose").onclick = () => { $("modal").classList.remove("on"); renderForm(); };

$("copy").textContent = "© " + new Date().getFullYear() + " Dept HSE - All Right Reserved";
renderList(); renderForm();
</script>
